<?xml version="1.0" encoding="UTF-8"?>
<!--
  Play Store listing icon for Fluyo.
  Final output target: 512×512 PNG, < 1 MB.
  Background is teal #00897B; white F-mark + accent dot live inside the
  inner safe area (matches the launcher icon's proportions).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">
  <!-- Teal background (FluyoTeal) -->
  <rect width="512" height="512" fill="#00897B"/>
  <!-- F mark + accent dot, scaled to fill the safe zone -->
  <!-- (icon proportions match design/launcher_icon_foreground.svg, scaled ×4.74) -->
  <g fill="#FFFFFF">
    <!-- Vertical stem -->
    <rect x="160" y="120" width="66" height="266" rx="14"/>
    <!-- Top horizontal arm -->
    <rect x="160" y="120" width="218" height="66" rx="14"/>
    <!-- Middle (shorter) horizontal arm -->
    <rect x="160" y="226" width="152" height="56" rx="14"/>
    <!-- Accent dot — flowing data point -->
    <circle cx="362" cy="362" r="34"/>
  </g>
</svg>
