version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Lima
    open-pull-requests-limit: 5
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: America/Lima
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: deno
    directory: /supabase/functions/delete-account
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: America/Lima
    open-pull-requests-limit: 5
    groups:
      deno-dependencies:
        patterns:
          - "*"
